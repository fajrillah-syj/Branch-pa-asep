<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Siswa | K-Pulse</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% 20%, rgba(139, 92, 246, 0.15) 0%, transparent 50%);
        }

        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 30px;
            padding: 40px 30px;
            width: 380px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: 0.4s ease;
        }

        .card:hover {
            border-color: rgba(139, 92, 246, 0.6);
            box-shadow: 0 0 35px rgba(139, 92, 246, 0.25);
            transform: translateY(-5px);
        }

        h2 {
            margin: 0 0 5px 0;
            font-size: 1.8rem;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        .role {
            color: #a78bfa;
            font-size: 0.9rem;
            margin-bottom: 25px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-table {
            text-align: left;
            width: 100%;
            border-collapse: collapse;
        }

        .info-table tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .info-table tr:last-child {
            border-bottom: none;
        }

        .info-table th, .info-table td {
            padding: 12px 0;
            font-size: 0.9rem;
        }

        .info-table th {
            color: #94a3b8;
            width: 38%;
            font-weight: 400;
        }

        .info-table td {
            color: #f1f5f9;
            font-weight: 600;
            text-align: right;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Fajrillah</h2>
        <div class="role">Siswi PPLG</div>

        <table class="info-table">
            <tr>
                <th>Kelas</th>
                <td>11 PPL 1</td>
            </tr>
            <tr>
                <th>Sekolah</th>
                <td>SMKN 1 Garut</td>
            </tr>
            <tr>
                <th>Jurusan</th>
                <td>PPLG</td>
            </tr>
            <tr>
                <th>Hobi</th>
                <td>Membaca, Memasak, Memanah</td>
            </tr>
        </table>
    </div>

</body>
</html>
